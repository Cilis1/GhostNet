name: Build & Release

on:
  push:
    branches: ['**']
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux - rules, playtest bots, headless screenshot tour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (headless software renderer, no display needed)
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DGHOSTNET_HEADLESS=ON
          cmake --build build -j
      - name: Unit tests, C++ playtest bots, and a click-and-type autoplay of the real UI
        run: |
          if ! ctest --test-dir build --output-on-failure > ctest.log 2>&1; then
            cat ctest.log
            # surface the failure as an annotation (readable without the raw log)
            echo "::error title=ctest failed::$(grep -E 'FAILED|Failed|clickable|problems|FAIL' ctest.log | head -20 | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
          cat ctest.log
      - name: Longer bot sweep (deep job must be beatable on every seed)
        run: |
          for s in 1 2 3 4 5 6 8 9 10 12 13 14 15; do build/ghostnet_sim $s 70 deep > /dev/null || { echo "seed $s failed"; exit 1; }; done
          for s in 1 2 3 4 5; do build/ghostnet_sim $s 50 chaos > /dev/null || { echo "chaos seed $s failed"; exit 1; }; done
          for s in 1 2 3 4 5 6 7 8; do build/ghostnet_sim $s 70 subnet > /dev/null || { echo "subnet seed $s failed"; exit 1; }; done
          for s in 1 2 4 5 6 8 9 10 11 12 13 14 15 16; do build/ghostnet_sim $s 110 tower > /dev/null || { echo "tower seed $s failed"; exit 1; }; done
      - name: Screenshot tour (drives every screen of the real front end)
        run: build/GhostNet --shots shots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/*.png
          if-no-files-found: error

  windows:
    name: Windows build (MSVC, static runtime, raylib + GLFW)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Work out version and signing key
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.0-dev"; fi
          PUB=$(tr -d ' \r\n' < .github/signing-pubkey.txt || true)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "PUBKEY=$PUB" >> "$GITHUB_ENV"
      - name: Configure
        run: cmake -S . -B build -A x64 -DGHOSTNET_VERSION="$env:VERSION" -DGHOSTNET_REPO="${{ github.repository }}" -DGHOSTNET_SIGNING_PUBKEY_HEX="$env:PUBKEY"
      - name: Build
        run: cmake --build build --config Release
      - name: Tests
        run: |
          ctest --test-dir build -C Release --output-on-failure
          build\Release\GhostNet-Setup.exe --selftest
          if ($LASTEXITCODE -ne 0) { exit 1 }
          # GhostNet.exe is a GUI-subsystem app, so wait for it explicitly and capture its output.
          $p = Start-Process build\Release\GhostNet.exe -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path version.txt -Pattern 'GhostNet')) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-binaries
          path: |
            build/Release/GhostNet.exe
            build/Release/GhostNet-Setup.exe
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-binaries
          path: bin
      - name: Assemble payload and manifest
        run: |
          V="${GITHUB_REF_NAME#v}"
          mkdir payload
          cp bin/GhostNet.exe payload/
          cp packaging/README.txt payload/
          cp packaging/THIRD-PARTY-NOTICES.txt payload/
          python3 tools/make_manifest.py "$GITHUB_REPOSITORY" "$V" ghostnet-manifest.txt payload/*
      - name: Sign manifest (if a signing key is configured)
        env:
          SIGNING_KEY: ${{ secrets.GHOSTNET_SIGNING_KEY }}
        run: |
          PUB=$(tr -d ' \r\n' < .github/signing-pubkey.txt || true)
          if [ -n "$SIGNING_KEY" ]; then
            umask 077
            printf '%s\n' "$SIGNING_KEY" > "$RUNNER_TEMP/key.pem"
            python3 tools/sign_manifest.py "$RUNNER_TEMP/key.pem" ghostnet-manifest.txt ghostnet-manifest.sig
            rm -f "$RUNNER_TEMP/key.pem"
          elif [ -n "$PUB" ]; then
            echo "::error::.github/signing-pubkey.txt is set but the GHOSTNET_SIGNING_KEY secret is missing; the installer would refuse this release."
            exit 1
          else
            echo "No signing key configured; publishing an unsigned (hash-verified) manifest."
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${GITHUB_REF_NAME#v}"
          SETUP_SHA=$(sha256sum bin/GhostNet-Setup.exe | cut -d' ' -f1)
          {
            echo "## GhostNet $V"
            echo
            echo "**Download \`GhostNet-Setup.exe\` and run it.** It fetches the game from this release over HTTPS,"
            echo "checks every file against the SHA-256 manifest (and GitHub's own digests), and installs to"
            echo "\`%LOCALAPPDATA%\\Programs\\GhostNet\` without needing admin rights."
            echo
            echo "Windows SmartScreen may warn because the exe is not code-signed: click *More info -> Run anyway*."
            echo
            echo "| file | sha256 |"
            echo "|---|---|"
            echo "| GhostNet-Setup.exe | \`$SETUP_SHA\` |"
            tail -n +4 ghostnet-manifest.txt | awk '{print "| " $4 " | `" $2 "` |"}'
          } > notes.md
          FILES="payload/GhostNet.exe payload/README.txt payload/THIRD-PARTY-NOTICES.txt ghostnet-manifest.txt bin/GhostNet-Setup.exe"
          [ -f ghostnet-manifest.sig ] && FILES="$FILES ghostnet-manifest.sig"
          gh release create "$GITHUB_REF_NAME" $FILES --title "GhostNet $V" --notes-file notes.md --verify-tag

  verify-release:
    name: End-to-end install test from the published release
    needs: release
    runs-on: windows-latest
    steps:
      - name: Download the published installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$env:GITHUB_REF_NAME" -R "$env:GITHUB_REPOSITORY" -p GhostNet-Setup.exe
      - name: Install, run, verify, uninstall
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'gn'
          .\GhostNet-Setup.exe --yes --no-shortcut --no-launch --no-color --dir $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $p = Start-Process (Join-Path $dir 'GhostNet.exe') -ArgumentList '--version' -Wait -PassThru -NoNewWindow -RedirectStandardOutput version.txt
          Get-Content version.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          .\GhostNet-Setup.exe --yes --check --no-color
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\GhostNet-Setup.exe --yes --uninstall --no-color --dir $dir
          if ($LASTEXITCODE -ne 0) { exit 1 }
